      text-align: center;

      margin-bottom: 30px;

    #pdf-pages canvas {
      display: block;
      width: 100%;
      height: auto;
      margin-bottom: 12px;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
  </style>
</head>

<body>
    <div class="navbar">

  <main class="publication">
    <h1>Catalyst — Spring 2026</h1>
    <div id="pdf-pages">Loading publication...</div>
  </main>

  <script type="module">
    import * as pdfjsLib from
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.149/build/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.149/build/pdf.worker.min.mjs";

    const container = document.getElementById("pdf-pages");

    async function displayPDF() {
      try {
        const pdf = await pdfjsLib.getDocument("catalyst_spring_2026.pdf").promise;
        container.innerHTML = "";

        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const viewport = page.getViewport({ scale: 1.5 });

          const canvas = document.createElement("canvas");
          const context = canvas.getContext("2d");

          canvas.width = viewport.width;
          canvas.height = viewport.height;

          container.appendChild(canvas);

          await page.render({
            canvasContext: context,
            viewport: viewport
          }).promise;
        }
      } catch (error) {
        container.textContent = "Could not load publication.";
        console.error(error);
      }
    }

    displayPDF();
  </script>
</body>
